name: my-first-workflow

# to get triggered on every push in this repo on any branch  
# python app in dev


on:
  push: 
    branches: 
        - dev
        - feature-1
        - main
  pull_request: 
    branches:
        - main
        
jobs:
  unit-tests:
    name: running unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.2
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.10'
      - name: Install Dependencies    
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Unit Tests
        run: |
          mkdir report/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml:reports/coverage.xml --cov-report=term-missing -v
      - name: upload code coverage report
        uses: actions/upload-artifact@v5.0.0
        with:
          name: unit-test-report
          path: reports/
  codeql: 
   name: CodeQl security scan
   runs-on: ubuntu-latest
   permissions:
     actions: read
     contents: read        
     security-events: write
   strategy:
     matrix:
       language: ['python']
   steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2   
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "security" 
  
  sonarqube:
    name: SonarQube
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0  # Shallow clones  should be disabled for a better relevancy of analysis
      - name: download coverage report
        uses: actions/download-artifact@v5.0.0
        with:
          name: unit-test-report
          path: reports/
      - name: SonarQube Scan
        uses: SonarSource/sonarcloud-github-action@v2   
        env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [sonarqube, codeql]
    if: success()
    outputs: 
      image-tag : ${{ steps.vars.outputs.IMAGE_TAGS }}
    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.2
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: generate image tag
        id: vars
        run: |
           IMAGE_TAGS="${{ github.run_id }}-${GITHUB_SHA::7}"
            echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_OUTPUT
      - name: build Image (no push)
        uses: docker/build-push-action@v3.0.0
        with:
          context: .
          file: ./Dockerfile
          tags: thinknyx-app:${{ steps.vars.outputs.IMAGE_TAGS }}
          push: false      
      - name: save docker iamge
        run: docker save thinknyx-app:${{ steps.vars.outputs.IMAGE_TAGS }} -o thinknyx-app.tar    
      - name: upload docker image
        uses: actions/upload-artifact@v5.0.0
        with: 
          name: thinknyx-app-image
          path: thinknyx-app.tar 