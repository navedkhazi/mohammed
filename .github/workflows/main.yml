name: my-first-workflow

# to get triggered on every push in this repo on any branch  

on:
  push: 
    branches: 
        - dev
        - feature-1
        - main
  pull_request: 
    branches:
        - main
        
jobs:
  unit-tests:
    name: running unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.2
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.10'
      - name: Install Dependencies    
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Unit Tests
        run: |
          mkdir report/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
      - name: upload code coverage report
        uses: actions/upload-artifact@v5.0.2
        with:
          name: unit-test-report
          path: reports/
