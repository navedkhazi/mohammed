name: my-first-workflow

# to get triggered on every push in this repo on any branch

on:
  push: 
  workflow_dispatch: 
  

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step2 - checkout
        uses: actions/checkout@v5.0.0
      - name: step3
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifact
          echo 'ls -ltr' >> artifact/list.txt
          echo 'hostname' >> artifact/hostname.txt
      - name: upload single file
        uses: actions/upload-artifact@v4
        with:
          name: single_file
          path: ./myartifact.txt
      - name: upload from directory   
        uses: actions/upload-artifact@v4
        with:
           name: directory-aftifact
           path: artifact/
      - name: upload from multiple paths
        uses: actions/upload-artifact@v5.0.0
        with:
            name: multiple path
            path: |
              ./myartifact.txt
              artifact/
      - name: upload from multiple paths with exclusion
        uses: actions/upload-artifact@v5.0.0
        with:
            name: multiple path with exclusion
            path: |
              ./myartifact.txt
              artifact/       
              !**/hostname.txt
  job2:
    name: job2
    needs: job1
    runs-on: ubuntu-latest
    steps:
        - name: checking current directory
          run: |
               pwd
               ls -ltr 
        - name: download a single file artifact
          uses: actions/download-artifact@v5.0.0
          with:
            name: single_file
        - name: checking current directory post download
          run: |
               pwd
               ls -ltr      
     
  job3:
    name: job3
    needs: job1
    runs-on: ubuntu-latest
    steps:
        - name: checking current directory
          run: |
               pwd
               ls -ltr 
        - name: download directory
          uses: actions/download-artifact@v5.0.0
          with:
            name: directory-aftifact
        - name: checking current directory post download
          run: |
               pwd
               ls -ltr            
                 
      
        
  
