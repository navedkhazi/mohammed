name: my-first-workflow

# to get triggered on every push in this repo on any branch

on:
  push: 
  workflow_dispatch: 
  

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step2 - checkout
        uses: actions/checkout@v6.0.2
      - name: step3
        run: |
          echo pwd >> myartifact.txt
          mkdir artifact
          echo 'ls -ltr' >> artifact/list.txt
          echo 'hostname' >> artifact/hostname.txt
      - name: steps3 uplaod artifact
        uses: actions/upload-artifact@v4
        with:
          name: single artifact
          path: ./myartifact.txt
      - name: upload from directory   
        uses: actions/upload-artifact@v4
        with:
           name: directory-aftifact
           path: artifact/
      - name: upload from multiple paths
        uses: actions/upload-artifact@v4
        with:
            name: multiple path
            path: |
              ./myartifact.txt
              artifact/
      - name: upload from multiple paths with exclusion
        uses: actions/upload-artifact@v4
        with:
            name: multiple path with exclusion
            path: |
              ./myartifact.txt
              artifact/       
              !**/hostname.txt 
      
        
  
