name: my-first-workflow

# to get triggered on every push in this repo on any branch  

on:
  push: 
    branches: 
        - main
  pull_request: 
    branches:
        - main
  

jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    steps:
      - name: step1
        run: |
          pwd
          ls -ltr
          hostname
      - name: step2 - checkout
        uses: actions/checkout@v5.0.0
      - name: step3
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifact
          echo 'ls -ltr' >> artifact/list.txt
          echo 'hostname' >> artifact/hostname.txt
      - name: upload single file
        uses: actions/upload-artifact@v4
        with:
          name: single_file
          path: ./myartifact.txt
    
  job2:
    name: job2
    needs: job1
    runs-on: ubuntu-latest
    steps:
        - name: checking current directory
          run: |
               pwd
               ls -ltr 
        - name: download a single file artifact
          uses: actions/download-artifact@v5.0.0
          with:
            name: single_file
        - name: checking current directory post download
          run: |
               pwd
               ls -ltr   
        - name: step for PR demo
          run: exit 0
     
             
                 
      
        
  
