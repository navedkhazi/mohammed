name: my-first-workflow

# to get triggered on every push in this repo on any branch  
# python app in dev

on:
  push: 
    branches: 
        - dev
        - feature-1
        - main
  pull_request: 
    branches:
        - main
        
jobs:
  unit-tests:
    name: running unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6.0.2
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.10'
      - name: Install Dependencies    
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Run Unit Tests
        run: |
          mkdir report/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
      - name: upload code coverage report
        uses: actions/upload-artifact@v5.0.0
        with:
          name: unit-test-report
          path: reports/
  codeql: 
   name: CodeQl security scan
   runs-on: ubuntu-latest
   permissions:
     actions: read
     contents: read        
     security-events: write
   strategy:
     matrix:
       language: ['python']
   steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2   
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2.0.0
        with:
          languages: ${{ matrix.language }}
      - name: perform CodeQL analysis
        uses: github/codeql-action/analyze@v2.0.0
        with:
          category: "security" 