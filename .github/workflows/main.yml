name: my-first-workflow

# to get triggered on every push in this repo on any branch  
# python app in dev


on:
  push: 
    branches: 
        - dev
        - feature-1
        - main
  pull_request: 
    branches:
        - main

permissions: 
    actions: read
    security-events: write
    packages: write
    contents: read      
        
jobs:
  ci-pipeline-job:
    uses: navedkhazi/reusable-workflows/.github/workflows/ci-pipeline.yml@main

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}